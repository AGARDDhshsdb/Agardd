<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایران</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d0f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            cursor: pointer;
            user-select: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* تصویر پرچم شیر و خورشید با افکت و سایه زیبا */
        .flag-img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .container:active .flag-img {
            transform: scale(0.98);
        }

        /* راهنمای لمس صفحه */
        .play-hint {
            position: absolute;
            bottom: 30px;
            color: #ffffff;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            transition: opacity 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body onclick="playAudio()">

    <div class="container">
        <!-- عکس باکیفیت پرچم شیر و خورشید مستقیم از اینترنت -->
        <img class="flag-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Flag_of_Iran_%2(1964-1980%).svg/1280px-Flag_of_Iran_%2(1964-1980%).svg.png" alt="پرچم شیر و خورشید">
        
        <div id="hint" class="play-hint">برای پخش / توقف آهنگ روی صفحه لمس کنید</div>
    </div>

    <!-- فایل آهنگ آپلود شده شما در گیت‌هاب -->
    <audio id="bg-music" loop autoplay src="music.mp3"></audio>

    <script>
        const audio = document.getElementById('bg-music');
        const hint = document.getElementById('hint');

        // تلاش برای پخش خودکار هنگام ورود
        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(() => {
                hint.style.opacity = '0';
            }).catch(() => {
                // در صورت بلاک شدن توسط مرورگر، پیغام نمایش داده می‌ماند
            });
        });

        // پخش و توقف با کلیک/لمس روی صفحه
        function playAudio() {
            if (audio.paused) {
                audio.play();
                hint.style.opacity = '0';
            } else {
                audio.pause();
                hint.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
